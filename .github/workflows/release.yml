
name: Build and Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        run: python src/train.py --version "${{ github.ref_name }}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/haiderali52891/diabetes-triage:${{ github.ref_name }}
            ghcr.io/haiderali52891/diabetes-triage:latest
          labels: |
            org.opencontainers.image.source=https://github.com/HaiderAli52891/diabetes-triage
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Test published Docker image
        run: |
          docker pull ghcr.io/haiderali52891/diabetes-triage:${{ github.ref_name }}
          docker run -d --name diabetes-triage-test -p 8080:80 ghcr.io/haiderali52891/diabetes-triage:${{ github.ref_name }}

          for i in $(seq 1 15); do
            if curl --fail http://localhost:8080/health; then
              echo "Health check passed"
              docker rm -f diabetes-triage-test
              exit 0
            fi
            sleep 2
          done

          docker logs diabetes-triage-test
          docker rm -f diabetes-triage-test
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
